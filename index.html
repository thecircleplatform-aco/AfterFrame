<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AfterFrame" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AfterFrame</title>
    <script>
      // Start clock for the boot preload: React measures the minimum run time from here.
      window.__afSplashAt = Date.now();
    </script>
    <style>
      /*
        AfterFrame boot preload.

        Static markup + CSS on purpose: it animates from the very first paint, before
        React and this app's bundle have loaded, so the wait never looks dead. React
        (src/components/brand/afterframe-intro.tsx) only adds .af-out to play the finale
        and then removes the node.

        The A flies in from the top-left corner, the F from the bottom-right. They lock
        together and a mist of light breathes out of the channel between them.

        Nothing is ever painted still: the halves start off-canvas at zero opacity, so the
        first frame is the dark galaxy backdrop, never a parked logo.
      */
      #af-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        pointer-events: none;
        background: radial-gradient(ellipse at center, #0d0d10 0%, #000 70%);
        /* Safety net: if the app never boots, the preload still gets out of the way. */
        animation: af-splash-bailout 400ms ease 8s forwards;
      }

      #af-splash .af-stage {
        --af-h: clamp(150px, 28vh, 220px);
        position: relative;
        width: calc(var(--af-h) * 396 / 302);
        height: var(--af-h);
        /* Keeps the wait alive while the app finishes booting. */
        animation: af-breathe 2.8s ease-in-out 760ms infinite alternate;
      }

      #af-splash .af-half {
        position: absolute;
        inset: 0;
        background: #fff;
        -webkit-mask-image: url(/brand/af-mark-black.png);
        mask-image: url(/brand/af-mark-black.png);
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        will-change: transform, opacity;
        animation: af-half-in 760ms cubic-bezier(0.25, 0.8, 0.28, 1) both;
      }

      /* Artwork is 396x302 and its channel runs x=169-176 at the top to x=267-274 at the
         bottom. Each clip line sits inside that channel, so the halves only ever share
         transparent pixels as they pull apart. */
      #af-splash .af-a {
        clip-path: polygon(0% 0%, 44.2% 0%, 68.6% 100%, 0% 100%);
        --af-dx: -46vw;
        --af-dy: -44vh;
        --af-rot: -6deg;
      }

      #af-splash .af-f {
        clip-path: polygon(42.9% 0%, 100% 0%, 100% 100%, 68.1% 100%);
        --af-dx: 46vw;
        --af-dy: 44vh;
        --af-rot: 6deg;
      }

      @keyframes af-half-in {
        from {
          transform: translate3d(var(--af-dx), var(--af-dy), 0) rotate(var(--af-rot)) scale(0.96);
          opacity: 0;
        }
        32% {
          opacity: 0.6;
        }
        to {
          transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
          opacity: 1;
        }
      }

      /* Soft, unclipped, edge-free haze sitting on the channel between the borders. */
      #af-splash .af-mist {
        position: absolute;
        left: 55.9%;
        top: 50%;
        opacity: 0;
        will-change: transform, opacity;
        animation: af-mist-in 820ms cubic-bezier(0.33, 0.6, 0.4, 1) both;
      }

      #af-splash .af-mist-halo {
        --af-peak: 0.34;
        width: 58%;
        height: 150%;
        background: radial-gradient(
          ellipse closest-side,
          rgb(255 255 255 / 0.55),
          rgb(255 255 255 / 0.22) 42%,
          transparent 78%
        );
      }

      #af-splash .af-mist-core {
        --af-peak: 1;
        width: 26%;
        height: 122%;
        background: radial-gradient(
          ellipse closest-side,
          #fff,
          rgb(255 255 255 / 0.72) 26%,
          rgb(255 255 255 / 0.2) 62%,
          transparent 90%
        );
      }

      @keyframes af-mist-in {
        from {
          transform: translate(-50%, -50%) rotate(-17.63deg) scale(1, 0.6);
          opacity: 0;
        }
        to {
          transform: translate(-50%, -50%) rotate(-17.63deg) scale(1, 1);
          opacity: var(--af-peak);
        }
      }

      /* Slow pulse of light across the channel: the hold state, so a slow boot reads as
         "loading" instead of a frozen frame. */
      #af-splash .af-shimmer {
        position: absolute;
        left: 55.9%;
        top: 50%;
        width: 40%;
        height: 150%;
        transform: translate(-50%, -50%) rotate(-17.63deg);
        background: radial-gradient(ellipse closest-side, rgb(255 255 255 / 0.45), transparent 70%);
        opacity: 0;
        animation: af-shimmer 2.8s ease-in-out 760ms infinite;
      }

      @keyframes af-breathe {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.022);
        }
      }

      @keyframes af-shimmer {
        0%,
        100% {
          opacity: 0.05;
        }
        50% {
          opacity: 0.18;
        }
      }

      /* ---- Finale: played once React is mounted and the app is ready behind it ---- */
      #af-splash .af-flood {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
      }

      #af-splash.af-out {
        animation: af-splash-out 860ms cubic-bezier(0.4, 0, 0.6, 1) both;
      }

      #af-splash.af-out .af-a {
        animation: af-half-out-a 420ms cubic-bezier(0.45, 0, 0.55, 1) both;
      }

      #af-splash.af-out .af-f {
        animation: af-half-out-f 420ms cubic-bezier(0.45, 0, 0.55, 1) both;
      }

      #af-splash.af-out .af-mist-core {
        animation: af-mist-out 640ms cubic-bezier(0.33, 0.5, 0.4, 1) both;
      }

      #af-splash.af-out .af-mist-halo {
        animation: af-mist-out-wide 640ms cubic-bezier(0.33, 0.5, 0.4, 1) both;
      }

      #af-splash.af-out .af-shimmer {
        animation: af-shimmer-out 420ms ease-out both;
      }

      #af-splash.af-out .af-flood {
        animation: af-flood 860ms cubic-bezier(0.4, 0, 0.6, 1) both;
      }

      @keyframes af-half-out-a {
        from {
          transform: none;
          opacity: 1;
        }
        to {
          transform: translate3d(-52vw, -50vh, 0) rotate(-6deg) scale(1.04);
          opacity: 0;
        }
      }

      @keyframes af-half-out-f {
        from {
          transform: none;
          opacity: 1;
        }
        to {
          transform: translate3d(52vw, 50vh, 0) rotate(6deg) scale(1.04);
          opacity: 0;
        }
      }

      @keyframes af-mist-out {
        from {
          opacity: 1;
          transform: translate(-50%, -50%) rotate(-17.63deg) scale(1, 1);
        }
        to {
          opacity: 0;
          transform: translate(-50%, -50%) rotate(-17.63deg) scale(10, 7);
        }
      }

      @keyframes af-mist-out-wide {
        from {
          opacity: 0.34;
          transform: translate(-50%, -50%) rotate(-17.63deg) scale(1, 1);
        }
        to {
          opacity: 0.5;
          transform: translate(-50%, -50%) rotate(-17.63deg) scale(8, 6);
        }
      }

      @keyframes af-shimmer-out {
        from {
          opacity: 0.18;
        }
        to {
          opacity: 0;
        }
      }

      @keyframes af-flood {
        0% {
          opacity: 0;
        }
        30% {
          opacity: 0.05;
        }
        52% {
          opacity: 1;
        }
        100% {
          opacity: 1;
        }
      }

      @keyframes af-splash-out {
        0%,
        52% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      @keyframes af-splash-bailout {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #af-splash {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="af-splash" data-af-splash aria-hidden="true">
      <div class="af-stage">
        <span class="af-half af-a"></span>
        <span class="af-half af-f"></span>
        <span class="af-mist af-mist-halo"></span>
        <span class="af-mist af-mist-core"></span>
        <span class="af-shimmer"></span>
      </div>
      <span class="af-flood"></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
