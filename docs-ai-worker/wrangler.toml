name = "afterframe-docs-ai"
main = "src/index.mjs"
compatibility_date = "2026-01-01"
workers_dev = true

# The docs assistant's key lives here, once, for the whole deployment — not in the
# bundle (a Vite build would publish it) and not in every reader's browser.
#
#   cd docs-ai-worker
#   npx wrangler secret put DEEPSEEK_API_KEY     # the key itself is never in git
#
# Optional:
#   DOCS_MODEL     default "deepseek-chat"
#   DEEPSEEK_BASE  default "https://api.deepseek.com"

[vars]
ALLOWED_ORIGINS = "https://docs.afterframe.acocloud.app,https://afterframe.acocloud.app,http://localhost:5173,http://docs.localhost:5173"
DOCS_MODEL = "deepseek-chat"
